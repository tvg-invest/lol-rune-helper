<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoL Rune Helper</title>
<style>
  :root {
    --bg: #0a0e14; --panel: #121821; --panel2: #18202c; --line: #263142;
    --text: #e6e9ef; --muted: #8b95a7; --gold: #c8aa6e; --gold2: #f0e6d2;
    --blue: #0ac8b9; --red: #e84057; --green: #3fbf7f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
  h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 0 0 12px; font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .muted { color: var(--muted); }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
  header { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  header .champ { width: 72px; height: 72px; border-radius: 10px; border: 2px solid var(--gold); }
  header h1 { margin: 0; font-size: 26px; color: var(--gold2); }
  header .meta { color: var(--muted); font-size: 13px; }
  header .right { margin-left: auto; text-align: right; }
  .wr { font-size: 22px; font-weight: 700; }
  .roles { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 6px 12px; }
  button:hover { border-color: var(--gold); }
  button.active { background: var(--gold); color: #111; border-color: var(--gold); font-weight: 600; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; }
  .grid > div { min-width: 0; }
  @media (max-width: 760px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    header .right { margin-left: 0; text-align: left; flex-basis: 100%; }
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; }
  .tab img { width: 26px; height: 26px; }
  .tab img.sub { width: 18px; height: 18px; margin-left: -4px; }
  .tab .diff { display: block; font-size: 11px; opacity: .75; }
  .tab span { text-align: left; }
  .tab small { color: inherit; opacity: .8; }
  .tree { display: flex; align-items: flex-start; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .tree .style { width: 22px; height: 22px; opacity: .9; margin-top: 14px; flex: none; }
  .rune { display: flex; flex-direction: column; align-items: center; width: 70px; text-align: center; font-size: 11px; line-height: 1.25; color: var(--muted); }
  .rune img { width: 40px; height: 40px; object-fit: contain; flex: none; margin-bottom: 4px; }
  .rune.keystone { color: var(--gold2); }
  .rune.keystone img { width: 52px; height: 52px; margin-top: -6px; }
  .names { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .shards { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spell { display: flex; align-items: center; gap: 8px; }
  .spell img { width: 36px; height: 36px; border-radius: 6px; }
  .keys { display: flex; gap: 4px; }
  .key { width: 28px; height: 28px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; color: var(--gold2); }
  .key.r { color: var(--red); }
  .block { margin-bottom: 12px; }
  .block .title { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .items { display: flex; gap: 6px; flex-wrap: wrap; }
  .item { position: relative; }
  .item img { width: 42px; height: 42px; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .item .count { position: absolute; right: 2px; bottom: 0; font-size: 11px; font-weight: 700; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .block.counter .title { color: var(--blue); }
  .enemies { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .enemies img { width: 38px; height: 38px; border-radius: 6px; border: 1px solid var(--red); display: block; }
  .enemy-pick { padding: 0; border: 2px solid transparent; border-radius: 8px; background: none; }
  .enemy-pick.active { border-color: var(--gold); }
  .matchup { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-top: 4px; }
  .matchup img { width: 20px; height: 20px; border-radius: 4px; }
  .matchup b { color: var(--gold2); }
  a { color: var(--gold2); }
  .bar { height: 8px; border-radius: 4px; overflow: hidden; display: flex; background: var(--panel2); margin: 6px 0 4px; }
  .bar .ad { background: var(--red); } .bar .ap { background: #4f8cff; }
  .notes { margin: 10px 0 0; padding-left: 18px; color: var(--text); }
  .empty { text-align: center; padding: 70px 16px; }
  .empty .big { font-size: 20px; color: var(--gold2); margin-bottom: 6px; }
  pre.log { margin: 0; white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); max-height: 220px; overflow: auto; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  /* Live */
  .live-badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #fff; background: var(--red); border-radius: 4px; padding: 1px 6px; margin-right: 6px; vertical-align: middle; }
  .gold { font-size: 26px; font-weight: 700; color: var(--gold); }
  .advice { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .pick { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .pick.adapted { border-color: var(--blue); }
  .pick.progress { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .progtag { font-size: 10px; font-weight: 700; color: #111; background: var(--gold); border-radius: 3px; padding: 0 5px; margin-left: 6px; vertical-align: middle; }
  .pick .top { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .pick .top img { width: 52px; height: 52px; border-radius: 8px; border: 1px solid var(--line); flex: none; }
  .pick .name { font-weight: 600; color: var(--gold2); }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; margin-top: 3px; }
  .badge.ok { background: rgba(63,191,127,.15); color: var(--green); }
  .badge.no { background: rgba(139,149,167,.15); color: var(--muted); }
  .pick ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .pick .part { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .pick .part img { width: 22px; height: 22px; border-radius: 4px; }
  .team { margin-bottom: 14px; }
  .team-head { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .team-head b { color: var(--text); font-size: 14px; }
  .team.enemy .team-head b { color: var(--red); }
  .team.ally .team-head b { color: var(--blue); }
  .prow { display: grid; grid-template-columns: 34px minmax(90px, 1.2fr) 70px 40px minmax(0, 3fr); gap: 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .prow.me { background: rgba(200,170,110,.08); }
  .prow.dead { opacity: .45; }
  .prow > img { width: 34px; height: 34px; border-radius: 6px; }
  .prow .pn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .lvl { color: var(--muted); font-size: 11px; }
  .fedtag { font-size: 10px; font-weight: 700; color: #111; background: var(--gold); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  .prow .its { display: flex; gap: 3px; flex-wrap: wrap; }
  .prow .its img { width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--line); }
  @media (max-width: 640px) {
    .prow { grid-template-columns: 34px minmax(0, 1fr) 64px; }
    .prow .cs { display: none; }
    .prow .its { grid-column: 2 / -1; }
  }
  .toolbar { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 8px; }
  .toolbar button { font-size: 12px; padding: 4px 10px; background: var(--panel); }
  /* Overlay (Picture-in-Picture-vindue, altid øverst) */
  body.ov { background: rgba(10,14,20,.96); }
  body.ov main { padding: 10px; }
  .ov-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .ov-head .gold { font-size: 20px; }
  .ov-row { display: flex; gap: 8px; align-items: center; padding: 6px; border-radius: 8px; background: var(--panel2); margin-bottom: 6px; border: 1px solid var(--line); }
  .ov-row.progress { border-color: var(--gold); }
  .ov-row.afford { border-color: var(--green); }
  .ov-row.flash { animation: flash 1.2s ease-out 3; }
  @keyframes flash { 0%, 100% { background: var(--panel2); } 50% { background: rgba(63,191,127,.35); } }
  .ov-row img { width: 34px; height: 34px; border-radius: 6px; flex: none; }
  .ov-row .t { min-width: 0; flex: 1; }
  .ov-row .n { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ov-row .r { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ov-row .c { font-size: 12px; font-weight: 700; white-space: nowrap; }
  .ov-row .c.ok { color: var(--green); }
  .ov-foot { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .update { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: rgba(200,170,110,.12); border: 1px solid var(--gold); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
  .update b { color: var(--gold2); }
  .update button { margin-left: auto; background: var(--gold); color: #111; border-color: var(--gold); font-weight: 600; }
  .turn { display: inline-block; background: var(--red); color: #fff; font-weight: 700; font-size: 12px; letter-spacing: .06em; border-radius: 6px; padding: 3px 10px; margin-top: 6px; }
  .clist { display: flex; flex-direction: column; gap: 8px; }
  .crow { display: flex; gap: 10px; align-items: center; }
  .crow img { width: 38px; height: 38px; border-radius: 6px; flex: none; }
  .crow .t { min-width: 0; }
  .crow .n { font-weight: 600; }
  .crow .r { font-size: 12px; color: var(--muted); }
  .crow .wr { margin-left: auto; font-weight: 700; white-space: nowrap; }
  .good { color: var(--green); } .bad { color: var(--red); }
  .pool { display: flex; gap: 6px; flex-wrap: wrap; }
  .pool img { width: 34px; height: 34px; border-radius: 6px; }
  .buys { display: flex; gap: 8px; flex-wrap: wrap; }
  .buy { text-align: center; font-size: 11px; color: var(--muted); width: 54px; }
  .buy img { width: 40px; height: 40px; border-radius: 6px; border: 2px solid var(--line); display: block; margin: 0 auto 2px; }
  .buy.sug img { border-color: var(--green); }
  .buy.adp img { border-color: var(--blue); }
  table.hist { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.hist td, table.hist th { padding: 5px 6px; border-top: 1px solid var(--line); text-align: left; white-space: nowrap; }
  table.hist th { color: var(--muted); font-weight: 500; font-size: 12px; }
  table.hist img { width: 22px; height: 22px; border-radius: 4px; vertical-align: middle; margin-right: 6px; }
  .tablewrap { overflow-x: auto; }
  .skillup { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; padding: 4px 10px 4px 8px; border-radius: 8px; background: rgba(10,200,185,.12); border: 1px solid var(--blue); font-size: 13px; font-weight: 600; }
  .skillup .key { width: 26px; height: 26px; }
  .skillup.compact { margin-top: 0; padding: 2px 6px; font-size: 12px; gap: 5px; }
  .skillup.compact .key { width: 22px; height: 22px; font-size: 12px; }
  .tip-ic { width: 22px; height: 22px; border-radius: 4px; flex: none; }
  ol.routes { margin: 6px 0 0; padding-left: 20px; }
  ol.routes li { margin-bottom: 8px; }
  ol.routes .camps { font-weight: 600; font-size: 13px; }
  .plan-sub.blue { color: #4f8cff; } .plan-sub.red { color: var(--red); }
  .plan-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .plan-ic { width: 30px; height: 30px; border-radius: 6px; }
  .pill b { color: var(--gold2); font-weight: 600; }
  blockquote.tip { margin: 0 0 6px; padding: 8px 12px; border-left: 3px solid var(--gold); background: var(--panel2); border-radius: 0 8px 8px 0; font-style: italic; }
  .plan-build { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 6px 0; font-size: 12px; }
  .plan-build img { width: 28px; height: 28px; border-radius: 5px; border: 1px solid var(--line); }
  .plan-build .muted { min-width: 130px; }
  .plan-sub { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); margin-top: 12px; }
  .version { color: var(--muted); font-size: 11px; text-align: right; margin-top: 6px; }
  .phone { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .phone .qr { background: #fff; padding: 8px; border-radius: 8px; }
  .phone a { color: var(--gold2); word-break: break-all; font-size: 12px; }
</style>
</head>
<body>
<main id="app"><div class="empty"><div class="big">Starter...</div></div></main>
<script>
const $app = document.getElementById('app');
// Tilføj elementer til siden; lister flades ud og tomme værdier (null/false) springes over.
const put = (...xs) => $app.append(...xs.flat(Infinity).filter((x) => x != null && x !== false));
const pct = (x) => (x * 100).toFixed(1).replace('.', ',') + '%';
const num = (x) => x == null ? '' : x.toLocaleString('da-DK');

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (k === 'class') node.className = v;
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== false) node.append(c.nodeType ? c : String(c));
  return node;
}
const img = (src, alt, cls) => src ? el('img', { src, alt, title: alt, class: cls }) : null;

async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) alert((await res.json().catch(() => ({}))).error || 'Noget gik galt');
}

function statusLine(s) {
  const on = !/Venter på League|Mistede/.test(s.status);
  return el('div', { class: 'status' }, el('span', { class: 'dot' + (on ? ' on' : '') }), s.status);
}

function logCard(s) {
  const uc = s.updateCheck || {};
  const checked = uc.at ? new Date(uc.at).toTimeString().slice(0, 5) : null;
  const status = !checked ? 'ikke tjekket for opdatering endnu'
    : uc.ok === false ? `opdateringstjek fejlede kl. ${checked}`
    : s.update ? `ny version ${s.update.version} fundet kl. ${checked}`
    : `nyeste version (tjekket kl. ${checked})`;
  return el('div', { class: 'card' }, el('details', {}, el('summary', {}, 'Log'), el('pre', { class: 'log' }, s.log.join('\n'))),
    el('div', { class: 'version' }, `LoL Rune Helper ${s.version || ''} · ${status} · `,
      ['127.0.0.1', 'localhost'].includes(location.hostname)
        ? el('a', { href: '#', onclick: (e) => { e.preventDefault(); e.target.textContent = 'tjekker...'; post('/api/check-update', {}); } }, 'Tjek for opdatering')
        : null));
}

function updateBanner(s) {
  if (!s.update) return null;
  return el('div', { class: 'update' },
    el('div', {}, el('b', {}, `Ny version ${s.update.version} er klar`), s.update.notes ? el('div', { class: 'muted' }, s.update.notes.split('\n')[0]) : null),
    s.update.canApply && ['127.0.0.1', 'localhost'].includes(location.hostname)
      ? el('button', { onclick: (e) => { e.target.textContent = 'Opdaterer...'; e.target.disabled = true; post('/api/update', {}); } }, 'Opdater nu')
      : el('span', { class: 'muted' }, 'Hent den nye version'));
}

const wrClass = (wr) => (wr >= 0.515 ? 'good' : wr <= 0.485 ? 'bad' : '');
const crow = (c, sub, right, cls) => el('div', { class: 'crow' }, img(c.icon, c.name),
  el('div', { class: 't' }, el('div', { class: 'n' }, c.name), sub ? el('div', { class: 'r' }, sub) : null),
  right != null ? el('div', { class: 'wr ' + (cls || '') }, right) : null);

function renderDraft(s) {
  const d = s.draft;
  put(
    el('header', {},
      el('div', {}, el('h1', {}, 'Champion select'), el('div', { class: 'meta' }, `Din rolle: ${d.position}`), statusLine(s),
        d.myBanTurn ? el('div', { class: 'turn' }, 'DIN TUR TIL AT BANNE') : null)),
    el('div', { class: 'grid' },
      el('div', {},
        el('div', { class: 'card' }, el('h2', {}, 'Ban-forslag'),
          d.bans.length ? el('div', { class: 'clist' }, d.bans.map((b) => crow(b, b.reason)))
            : el('div', { class: 'muted' }, d.pool.length ? 'Ingen klare trusler mod dine champions.' : 'Jeg kender ikke dine champions til rollen endnu (mastery eller kampe med programmet).')),
        d.opponent ? el('div', { class: 'card' }, el('h2', {}, `Mod ${d.opponent.name}`),
          d.poolVs.length ? [el('div', { class: 'muted', style: 'font-size:12px;margin-bottom:8px' }, 'Dine champions:'),
            el('div', { class: 'clist' }, d.poolVs.map((x) => crow(x, `${num(x.games)} kampe`, pct(x.winRate), wrClass(x.winRate))))] : null,
          d.counters.length ? [el('div', { class: 'muted', style: 'font-size:12px;margin:12px 0 8px' }, `Stærkeste counters til ${d.opponent.name}:`),
            el('div', { class: 'clist' }, d.counters.map((x) => crow(x, `${num(x.games)} kampe`, pct(x.winRate), wrClass(x.winRate))))] : null)
          : el('div', { class: 'card' }, el('h2', {}, 'Counterpick'), el('div', { class: 'muted' }, 'Når din lane-modstander har valgt, viser jeg hvem i din pulje der klarer sig bedst mod dem.'))),
      el('div', {},
        el('div', { class: 'card' }, el('h2', {}, 'Din pulje til rollen'),
          d.pool.length ? el('div', { class: 'pool' }, d.pool.map((c) => img(c.icon, c.name))) : el('div', { class: 'muted' }, 'Ingen endnu.'),
          el('div', { class: 'muted', style: 'font-size:12px;margin-top:8px' }, 'Ud fra din mastery og dine kampe med programmet.')),
        phoneCard(s))),
    logCard(s));
}

// Mest brugte første clear pr. side (kun når du spiller jungle).
function jungleCard(j) {
  if (!j) return null;
  const side = (key, label, cls) => j[key] ? el('div', {},
    el('div', { class: 'plan-sub ' + cls, style: 'margin-top:0' }, label),
    el('ol', { class: 'routes' }, j[key].map((r) => el('li', {},
      el('div', { class: 'camps' }, r.camps.join(' → ')),
      el('div', { class: 'muted', style: 'font-size:11px' }, `${pct(r.share)} · ${num(r.games)} kampe`))))) : null;
  return el('div', { class: 'card' },
    el('h2', {}, 'Jungle-ruter (første clear)'),
    el('div', { class: 'grid' }, side('BLUE', 'Blå side', 'blue'), side('RED', 'Rød side', 'red')),
    el('div', { class: 'muted', style: 'font-size:11px;margin-top:6px' }, 'Mest spillede rækkefølger fra OP.GG - vælg den der passer til dit hold og modstanderens jungler.'));
}

// Gameplan mod lane-modstanderen: fast del (matchup) + "Lige nu" og ændringer under kampen.
function gameplanCard(p) {
  if (!p) return null;
  const chip = (label, value) => value ? el('span', { class: 'pill' }, `${label}: `, el('b', {}, value)) : null;
  return el('div', { class: 'card plan' },
    el('div', { class: 'plan-head' },
      img(p.me.icon, p.me.name, 'plan-ic'), el('span', { class: 'muted' }, 'mod'), img(p.opponent.icon, p.opponent.name, 'plan-ic'),
      el('h2', { style: 'margin:0' }, `Gameplan mod ${p.opponent.name}`),
      p.winRate != null ? el('span', { class: 'wr ' + wrClass(p.winRate), style: 'margin-left:auto;font-size:18px' }, pct(p.winRate)) : null),
    p.games ? el('div', { class: 'muted', style: 'font-size:12px;margin:-4px 0 8px' }, `Din win rate i ${num(p.games)} kampe`) : null,
    el('div', { class: 'shards', style: 'margin:0 0 10px' },
      chip('Lane', p.laneAdvantage === 'jævn' ? 'jævn' : p.laneAdvantage && `fordel ${p.laneAdvantage}`),
      chip('Flest solo kills', p.soloKill === 'jævn' ? 'jævnt' : p.soloKill),
      chip('Spillestil', p.playStyle)),

let qrLib = null;
const qrCache = {};
function loadQr() {
  if (!qrLib) {
    qrLib = new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      sc.onload = resolve;
      sc.onerror = reject;
      document.head.append(sc);
    });
  }
  return qrLib;
}

// Kun på computeren selv (telefonen har allerede nøglen).
function phoneCard(s) {
  if (!s.remote || !s.remote.urls.length || !['127.0.0.1', 'localhost'].includes(location.hostname)) return null;
  const main = s.remote.urls[0];
  // Samme QR-element genbruges ved hver opdatering, så den ikke tegnes forfra hvert 2. sekund.
  if (!qrCache[main.url]) {
    const node = el('div', { class: 'qr' });
    qrCache[main.url] = node;
    loadQr().then(() => new QRCode(node, { text: main.url, width: 132, height: 132 })).catch(() => node.remove());
  }
  const qr = qrCache[main.url];
  return el('div', { class: 'card' }, el('h2', {}, 'Åbn på telefonen'),
    el('div', { class: 'phone' }, qr,
      el('div', {}, el('div', { class: 'muted', style: 'font-size:12px;margin-bottom:6px' }, 'Scan koden. Telefonen skal være på samme wifi eller Tailscale.'),
        s.remote.urls.map((u) => el('div', {}, el('span', { class: 'muted' }, u.label + ': '), el('a', { href: u.url }, u.url))))));
}

function matchupLine(m) {
  if (!m) return null;
  return el('div', { class: 'matchup' }, 'Mod', img(m.icon, m.name), el('b', {}, m.name),
    m.winRate != null ? `${pct(m.winRate)} WR · ${num(m.games)} kampe` : el('span', { class: 'muted' }, 'ingen matchup-data'));
}

function render(s) {
  $app.replaceChildren();
  if (!s) return;
  if (['127.0.0.1', 'localhost'].includes(location.hostname)) put(toolbar(s));
  const banner = updateBanner(s);
  if (banner) put(banner);
  if (s.live) return renderLive(s);
  if (!s.champion && s.draft) return renderDraft(s);
  if (!s.champion) {
    put(
      el('div', { class: 'card' + (s.history ? '' : ' empty') }, el('div', { class: 'big', style: s.history ? 'font-size:18px;color:var(--gold2)' : '' }, 'LoL Rune Helper'), statusLine(s),
        el('p', { class: 'muted' }, 'I champion select får du ban- og counterpick-forslag; når du låser, sætter jeg runer, summoners og items. Under kampen kommer købsforslag og scoreboard her.')),
      historyCards(s),
      phoneCard(s),
      logCard(s));
    return;
  }
  const role = s.roleOverride;
  put(
    el('header', {},
      img(s.champion.icon, s.champion.name, 'champ'),
      el('div', {}, el('h1', {}, s.champion.name), el('div', { class: 'meta' }, `${s.position} · patch ${s.patch || '?'} · ${s.gameMode}`),
        s.patchNote ? el('div', { class: 'meta', style: 'color:var(--gold)' }, s.patchNote) : null,
        statusLine(s), matchupLine(s.matchup)),
      s.winRate != null ? el('div', { class: 'right' }, el('div', { class: 'wr' }, pct(s.winRate)), el('div', { class: 'meta' }, `${num(s.games)} kampe · ${s.statsScope}`)) : null),
    s.position !== 'ARAM' ? el('div', { class: 'roles' },

      el('div', {}, runesCard(s), itemsCard(s)),
      el('div', {}, spellsCard(s), enemyCard(s), phoneCard(s))),

// ---------- Overlay: lille vindue der altid ligger øverst (Document Picture-in-Picture, Chrome/Edge) ----------
let pip = null;
let lastState = null;
const settings = (() => { try { return JSON.parse(localStorage.getItem('lrh') || '{}'); } catch { return {}; } })();
const saveSettings = () => { try { localStorage.setItem('lrh', JSON.stringify(settings)); } catch {} };
if (settings.sound === undefined) settings.sound = true;

let audio = null;
function beep() {
  if (!settings.sound) return;
  try {
    audio = audio || new AudioContext();
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.35);
    o.connect(g).connect(audio.destination);
    o.start();
    o.stop(audio.currentTime + 0.35);
  } catch {}
}

async function openOverlay() {
  if (!('documentPictureInPicture' in window)) {
    alert('Overlay kræver Google Chrome eller Microsoft Edge (version 116 eller nyere). Åbn vinduet i en af dem.');
    return;
  }
  if (pip) { pip.focus(); return; }
  pip = await documentPictureInPicture.requestWindow({ width: 330, height: 360 });
  const style = pip.document.createElement('style');
  style.textContent = document.querySelector('style').textContent;
  pip.document.head.append(style);
  pip.document.title = 'LoL Rune Helper';
  pip.document.body.className = 'ov';
  pip.addEventListener('pagehide', () => { pip = null; if (lastState) render(lastState); });
  if (audio === null) { try { audio = new AudioContext(); } catch {} } // lyd kræver et klik - det er det her
  renderOverlay(lastState);
  if (lastState) render(lastState);
}

function overlayContent(s) {
  const L = s && s.live;
  if (L) {
    return [
      el('div', { class: 'ov-head' }, el('span', { class: 'gold' }, gold(L.gold)), skillLine(L, true), el('span', { class: 'muted' }, clock(L.gameTime))),
      L.inventory && L.inventory.starter ? el('div', { class: 'ov-row progress' },
        L.inventory.starter.items.map((it) => img(it.icon, it.name)),
        el('div', { class: 't' }, el('div', { class: 'n' }, 'Start'), el('div', { class: 'r' }, L.inventory.starter.items.map((it) => `${it.count > 1 ? `${it.count}x ` : ''}${it.name}`).join(', '))),
        el('div', { class: 'c' + (L.inventory.starter.canAfford ? ' ok' : '') }, L.inventory.starter.canAfford ? 'RÅD NU' : gold(L.inventory.starter.cost))) : null,
      L.inventory && L.inventory.full ? el('div', { class: 'ov-foot', style: 'margin:0 0 6px' },
        'Fuldt build' + (L.inventory.elixir ? ` · ${L.inventory.elixir.name}${L.inventory.elixir.canAfford ? ' (råd nu)' : ''}` : '')) : null,
      L.advice.map((a) => el('div', { class: 'ov-row' + (a.inProgress ? ' progress' : '') + (a.canAfford ? ' afford' : '') + (justAffordable.has(a.id) ? ' flash' : ''), 'data-id': a.id },
        img(a.icon, a.name),
        el('div', { class: 't' }, el('div', { class: 'n' }, a.name, a.inProgress ? el('span', { class: 'progtag' }, 'I GANG') : null),
          // "I GANG"-mærket viser allerede fremdriften; vis hellere hvorfor.
          el('div', { class: 'r' }, a.reasons.find((r) => !r.startsWith('Du er i gang')) || a.reasons[0])),
        el('div', { class: 'c' + (a.canAfford ? ' ok' : '') }, a.canAfford ? 'RÅD NU' : `mangler ${num(Math.round(a.cost - L.gold))}`))),
      L.enemy.fed.length ? el('div', { class: 'ov-foot' }, 'Fed: ' + L.enemy.fed.join(', ')) : null,
      L.matchup && L.matchup.winRate != null ? el('div', { class: 'ov-foot' }, `Mod ${L.matchup.name}: ${pct(L.matchup.winRate)} WR`) : null,
      s.plan && s.plan.log.length ? el('div', { class: 'ov-foot' }, `${clock(s.plan.log[0].t)} ${s.plan.log[0].text}`) : null,
    ];
  }
  if (s && s.champion) {
    const r = s.runeOptions[s.runeIndex] || s.runeOptions[0];
    const core = s.blocks.find((b) => b.title.startsWith('Core'));
    return [
      el('div', { class: 'ov-head' }, el('b', {}, `${s.champion.name} ${s.position}`), el('span', { class: 'muted' }, s.winRate != null ? pct(s.winRate) : '')),
      r ? el('div', { class: 'ov-row' }, img(r.primaryRunes[0].icon, r.primaryRunes[0].name), el('div', { class: 't' }, el('div', { class: 'n' }, r.primaryRunes[0].name), el('div', { class: 'r' }, r.secondary.name))) : null,
      core ? el('div', { class: 'ov-row' }, core.items.map((it) => img(it.icon, it.name)), el('div', { class: 'r' }, 'Core')) : null,
      s.matchup && s.matchup.winRate != null ? el('div', { class: 'ov-foot' }, `Mod ${s.matchup.name}: ${pct(s.matchup.winRate)} WR`) : null,
    ];
  }
  return [el('div', { class: 'muted' }, s ? s.status : 'Starter...')];
}

function renderOverlay(s) {
  if (!pip) return;
  const main = pip.document.createElement('main');
  main.append(...overlayContent(s).flat().filter(Boolean).map((n) => pip.document.importNode(n, true)));
  pip.document.body.replaceChildren(main);
}

// Bip + blink når et forslag går fra "mangler guld" til "råd nu".
let affordable = new Set();
let justAffordable = new Set();
let wasLive = false;
function trackAffordable(s) {
  const now = new Set((s.live?.advice || []).filter((a) => a.canAfford).map((a) => a.id));
  justAffordable = new Set([...now].filter((id) => !affordable.has(id)));
  // Ikke ved første live-besked (så bipper den ikke bare fordi vinduet åbnes).
  if (s.live && wasLive && justAffordable.size) beep();
  wasLive = Boolean(s.live);
  affordable = now;
}

function toolbar(s) {
  return el('div', { class: 'toolbar' },
    s.autostart != null ? el('button', {
      title: 'Starter programmet i baggrunden når du logger ind (uden at åbne browseren)',
      onclick: () => post('/api/autostart', { enabled: !s.autostart }),
    }, s.autostart ? 'Autostart: til' : 'Autostart: fra') : null,
    el('button', {
      title: 'Programmet siger "Råd til ...", "Level op: Q" og "X er fed" højt - virker også i ægte fuldskærm',
      onclick: () => post('/api/voice', { enabled: !s.voice }),
    }, s.voice ? 'Stemme: til' : 'Stemme: fra'),
    el('button', { title: 'Bip i browseren når du har råd til et forslag', onclick: () => { settings.sound = !settings.sound; saveSettings(); render(lastState); } }, settings.sound ? 'Bip: til' : 'Bip: fra'),
    el('button', { onclick: openOverlay, title: 'Lille vindue der altid ligger øverst - kræver Borderless i League' }, pip ? 'Overlay åben' : 'Overlay'));
}

let lastJson = '';
function connect() {
  const es = new EventSource('/events');
  es.onmessage = (e) => {
    if (e.data === lastJson) return;
    lastJson = e.data;
    const open = document.querySelector('details')?.open;
    lastState = JSON.parse(e.data);
    trackAffordable(lastState);
    render(lastState);
    renderOverlay(lastState);
    if (open) document.querySelector('details').open = true;
  };
  es.onerror = () => {
    es.close();
    $app.replaceChildren(el('div', { class: 'card empty' }, el('div', { class: 'big' }, 'Programmet er lukket'), el('div', { class: 'muted' }, 'Start LoL Rune Helper igen - siden genforbinder selv.')));
    lastJson = '';
    setTimeout(connect, 3000);
  };
}
connect();
</script>
